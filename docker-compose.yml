services:
  dashboard:
    build: .
    image: options-algo-trader
    container_name: options-dashboard
    ports:
      - "8501:8501"
    env_file:
      - options_agent/.env
    volumes:
      - ./options_agent/logs:/app/logs
      - ./options_agent/sweet_spot_journal:/app/sweet_spot_journal
      - ./options_agent/backtest_results:/app/backtest_results
      - ./options_agent/data_cache:/app/data_cache
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health')"]
      interval: 120s
      timeout: 10s
      start_period: 60s
      retries: 3
    restart: unless-stopped

  agent-spy:
    image: options-algo-trader
    container_name: options-agent-spy
    command: python scripts/run_sweet_spot_agent.py --daemon --symbol SPY --verbose-rejects
    env_file:
      - options_agent/.env
    environment:
      - PYTHONUNBUFFERED=1
      - AGENT_SYMBOL=SPY
    volumes:
      - ./options_agent/logs:/app/logs
      - ./options_agent/sweet_spot_journal:/app/sweet_spot_journal
      - ./options_agent/data_cache:/app/data_cache
      - ./options_agent/config:/app/config
      - ./options_agent/scripts:/app/scripts:ro
      - ./options_agent/src:/app/src:ro
    restart: unless-stopped
    profiles:
      - live

  agent-qqq:
